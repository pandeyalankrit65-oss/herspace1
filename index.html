<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HerSpace - Empowering Women Through Safety & Community</title>
    <meta name="description" content="HerSpace: SOS alerts to your trusted contacts, incident reporting, a community safety map and AI emotional support for women." />
    <meta name="author" content="HerSpace Team" />

    <meta property="og:title" content="HerSpace - Women's Safety & Support" />
    <meta property="og:description" content="SOS alerts to trusted contacts, incident reporting, a community safety map and AI support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#110f17" />
    <script>
      // Apply the saved (or system) theme before the first paint to avoid a flash.
      (function () {
        try {
          var c = localStorage.getItem("herspace_theme");
          var dark = c === "dark" || (c !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
